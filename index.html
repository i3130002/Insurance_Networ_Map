<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>

    <style>
        #map {
            height: 600px; /* Set a fixed height for the map */
            width: 100%;
        }
    </style>

    <title>File Loader from Dropdown</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #output {
            margin-top: 15px;
            padding: 10px;
            border: 1px solid #ccc;
            white-space: pre-wrap; /* Keeps formatting from the file */
            background-color: #f4f4f4;
        }
    </style>
</head>
<body>

    <h1>Choose Insurance</h1>

    <label for="fileSelect">Insurance:</label>
    <select id="fileSelect" onchange="loadInsuranceGeocode()">
        <option value="">-- Select an Insurance --</option>
        <option value="file1.txt">File 1</option>
        <option value="file2.txt">File 2</option>
        <option value="ecare-blue-1.json">JSON Data (Example)</option>
    </select>

    <h2>File Content:</h2>
    <div id="output">
        Select a file to load its content here.
    </div>

    <script>
        /**
         * Loads the content of the selected file using the Fetch API.
         */
        function loadInsuranceGeocode() {
            // 1. Get the selected filename from the dropdown
            const selectElement = document.getElementById('fileSelect');
            const filename = selectElement.value;
            const outputDiv = document.getElementById('output');

            // Clear previous content and check if a file was selected
            outputDiv.textContent = 'Loading...';
            if (!filename) {
                outputDiv.textContent = 'Select an insurance to load its content here.';
                return;
            }

            // 2. Use the Fetch API to request the file
            fetch(filename)
                .then(response => {
                    // Check if the response was successful (status 200-299)
                    if (!response.ok) {
                        // Throw an error if the file was not found or failed to load
                        throw new Error(`HTTP error! Status: ${response.status} - Could not find: ${filename}`);
                    }
                    // Determine how to read the file content based on the extension
                    // For simplicity, we assume text for all files here.
                    // For a JSON file, you would use response.json()
                    // return response.text(); // for plain text
                    
                    // Example to handle JSON differently
                    if (filename.endsWith('.json')) {
                        return response.json().then(data => {
                            // Convert JSON object to a nicely formatted string
                            return JSON.stringify(data, null, 2); 
                        });
                    } else {
                        return response.text(); // for .txt or other text files
                    }
                })
                .then(content => {
                    // 3. Display the file content in the output div
                    outputDiv.textContent = content;
                })
                .catch(error => {
                    // 4. Handle any errors during the fetch or processing
                    console.error('Error loading the file:', error);
                    outputDiv.textContent = `Error: ${error.message}`;
                });
        }
    </script>

    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <script>
        // 1. Initialize the map and set its view
        // Center the map over the approximate center of Dubai
        var dubaiCoords = [25.2048, 55.2708]; 
        var zoomLevel = 11;

        var map = L.map('map').setView(dubaiCoords, zoomLevel);

        // 2. Add the OpenStreetMap tile layer
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // 3. Define the two marker locations in Dubai
        var marker1_coords = [25.1972, 55.2744]; // Burj Khalifa (approx)
        var marker2_coords = [25.2532, 55.3657]; // Dubai International Airport (DXB - approx)

        // 4. Add the first marker (Burj Khalifa)
        var marker1 = L.marker(marker1_coords).addTo(map)
            .bindPopup("<b>Burj Khalifa</b><br>World's tallest building.");

        // 5. Add the second marker (Dubai International Airport)
        var marker2 = L.marker(marker2_coords).addTo(map)
            .bindPopup("<b>Dubai International Airport (DXB)</b><br>One of the world's busiest airports.");

        // Optional: Open the first popup by default
        marker1.openPopup(); 
    </script>
</body>
</html>
