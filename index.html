<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAE Insurance Network Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
    <style>
        :root { --brand: #0d6efd; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
        #map { position: absolute; inset: 0; }
        .panel {
            position: absolute; top: 12px; left: 12px; z-index: 1000;
            background: #fff; border-radius: 10px;
            box-shadow: 0 4px 18px rgba(0,0,0,.18);
            padding: 14px 16px; width: 320px; max-height: calc(100vh - 24px);
            overflow-y: auto;
        }
        .panel h1 { font-size: 1.05rem; margin: 0 0 10px; }
        .panel label { font-size: .8rem; color: #555; display: block; margin-bottom: 4px; }
        .panel select {
            width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px;
            font-size: .9rem; margin-bottom: 10px;
        }
        #status { font-size: .85rem; color: #666; min-height: 1.2em; margin-bottom: 6px; }
        #status.error { color: #b02a37; }
        .legend { font-size: .75rem; color: #666; border-top: 1px solid #eee; padding-top: 8px; margin-top: 8px; }
        .legend b { color: #333; }
        .type-icon {
            display:inline-block; width:18px; height:18px; line-height:18px; text-align:center;
            border-radius:50%; color:#fff; font-size:11px; font-weight:bold; margin-right:4px;
        }
        .popup-scroll { max-height: 220px; overflow-y: auto; }
        .popup-scroll h6 { margin-bottom: 2px; }
        .popup-scroll .muted { color: #777; font-size: .8rem; }
        .btn-link { font-size: .8rem; padding: 0; }
        .leaflet-control-attribution { font-size: 10px; }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="panel" id="panel">
        <h1>🇦🇪 UAE Insurance Network Map</h1>
        <label for="planSelect">Insurance plan:</label>
        <select id="planSelect" onchange="loadPlan(this.value)">
            <option value="">-- Select a plan --</option>
        </select>
        <div id="status"></div>
        <div class="legend" id="legend">
            <b>Provider types:</b><br>
            <span class="type-icon" style="background:#0d6efd">C</span>Clinic
            <span class="type-icon" style="background:#dc3545">H</span>Hospital
            <span class="type-icon" style="background:#198754">P</span>Pharmacy
            <span class="type-icon" style="background:#fd7e14">D</span>Dental
            <span class="type-icon" style="background:#6f42c1">X</span>Diagnostic
            <span class="type-icon" style="background:#20c997">Y</span>Daycare
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script>
        'use strict';

        // ---------- constants ----------
        const UAE_CENTER = [24.4, 54.6];   // centroid of all 8 emirates
        const UAE_ZOOM = 8;
        const TYPE_COLORS = {
            'CLINIC': '#0d6efd', 'HOSPITAL': '#dc3545', 'PHARMACY': '#198754',
            'DENTAL': '#fd7e14', 'DIAGNOSTIC CENTRE': '#6f42c1', 'DAYCARE': '#20c997'
        };
        const EMIRATE_NAMES = {
            AJM: 'Ajman', AUH: 'Abu Dhabi', DXB: 'Dubai', FUJ: 'Fujairah',
            RAK: 'Ras Al Khaimah', SHJ: 'Sharjah', UMQ: 'Umm Al Quwain', ALAIN: 'Al Ain'
        };

        // ---------- map state (created once) ----------
        const map = L.map('map').setView(UAE_CENTER, UAE_ZOOM);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);
        let cluster = null;   // recreated per plan load

        // ---------- helpers ----------
        const statusEl = document.getElementById('status');
        function setStatus(msg, isError = false) {
            statusEl.textContent = msg;
            statusEl.classList.toggle('error', isError);
        }

        function esc(s) {  // escape HTML in data-driven strings
            return String(s ?? '').replace(/[&<>"']/g,
                c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function coordOk(e) {
            const la = parseFloat(e.lat), lo = parseFloat(e.lon);
            return Number.isFinite(la) && Number.isFinite(lo) &&
                   la >= 22 && la <= 26.6 && lo >= 51 && lo <= 56.6;
        }

        function typeColor(type) { return TYPE_COLORS[type] || '#6c757d'; }

        function popupHtml(e) {
            const em = EMIRATE_NAMES[e.P] || e.P || '—';
            const query = `I am looking for my provider to seek medical treatment. `
                + `Find this business on Google Maps:\nName: ${e['PROVIDER NAME']}\n`
                + `Address: ${e.ADDRESS}\nPhone: ${e.TELEPHONE}\nEmirate: ${em}\n`
                + `Type: ${e['PROVIDER TYPE']}\nArea: ${e.AREA}`;
            const mapsQuery = encodeURIComponent(
                `${e['PROVIDER NAME']} ${e.AREA} ${em} UAE`);
            return `<div class="popup-scroll">
                <h6>${esc(e['PROVIDER NAME'])}</h6>
                <span class="muted">${esc(e['PROVIDER TYPE'])} · ${esc(em)} · ${esc(e.AREA)}</span><br>
                <small>${esc(e.ADDRESS)}</small><br>
                <small>☎ ${esc(e.TELEPHONE) || '—'}</small>
                ${e.confidence ? `<br><small class="muted">Geocode: ${esc(e.confidence)}</small>` : ''}
                <br><a href="https://www.google.com/maps/search/?api=1&query=${mapsQuery}"
                    target="_blank" rel="noopener">📍 Google Maps</a>
                &nbsp;<a href="https://www.google.com/search?q=${encodeURIComponent(query)}"
                    target="_blank" rel="noopener">🤖 Google AI</a>
            </div>`;
        }

        // ---------- data loading ----------
        async function loadPlans() {
            try {
                const res = await fetch('data/plans.json');
                if (!res.ok) throw new Error(`plans.json: HTTP ${res.status}`);
                const plans = await res.json();
                const sel = document.getElementById('planSelect');
                // Group by insurer
                const byInsurer = {};
                plans.forEach(p => {
                    (byInsurer[p.insurer] = byInsurer[p.insurer] || []).push(p);
                });
                Object.keys(byInsurer).sort().forEach(ins => {
                    const g = document.createElement('optgroup');
                    g.label = ins;
                    byInsurer[ins].forEach(p => {
                        const o = document.createElement('option');
                        o.value = p.file;
                        o.textContent = `${p.name} (${p.providers})`;
                        g.appendChild(o);
                    });
                    sel.appendChild(g);
                });
                setStatus(`${plans.length} plans available`);
            } catch (err) {
                setStatus(`Failed to load plan list: ${err.message}`, true);
            }
        }

        async function loadPlan(file) {
            if (!file) return;
            setStatus('Loading…');
            if (cluster) { map.removeLayer(cluster); cluster = null; }

            try {
                const res = await fetch(file);
                if (!res.ok) throw new Error(`HTTP ${res.status} — ${file}`);
                const data = await res.json();

                cluster = L.markerClusterGroup({
                    disableClusteringAtZoom: 16,
                    maxClusterRadius: 45,
                    showCoverageOnHover: false
                });

                let skipped = 0;
                data.forEach(e => {
                    if (!coordOk(e)) { skipped++; return; }   // guard: bad coords
                    const icon = L.divIcon({
                        className: '',
                        html: `<span class="type-icon" style="background:${typeColor(e['PROVIDER TYPE'])}">${(e['PROVIDER TYPE']||'?')[0]}</span>`,
                        iconSize: [18, 18], iconAnchor: [9, 9]
                    });
                    L.marker([parseFloat(e.lat), parseFloat(e.lon)], { icon })
                        .bindPopup(popupHtml(e))
                        .addTo(cluster);
                });

                map.addLayer(cluster);
                map.fitBounds(cluster.getBounds().pad(0.05));

                const loaded = data.length - skipped;
                setStatus(`✅ ${loaded.toLocaleString()} providers shown` +
                    (skipped ? ` · ${skipped} skipped (bad coords)` : ''));
            } catch (err) {
                setStatus(`Error: ${err.message}`, true);
                console.error(err);
            }
        }

        // ---------- boot ----------
        loadPlans();
    </script>
</body>
</html>
