<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <style>
        #map {
            height: 100vh; /* Full height */
            width: 100vw;  /* Full width */
        }
    </style>

    <title>File Loader from Dropdown</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        
    </style>
</head>
<body>
    <div class="container" id="setup"> 
        <h1>Choose Insurance</h1>
        
        <label for="fileSelect">Insurance:</label>
        <select id="fileSelect" onchange="loadInsuranceGeocode()">
            <option value="">-- Select an Insurance --</option>
            <option value="ecare-blue.json">JSON Data (Example)</option>
        </select>
        
        <div id="output" >
        </div>
    </div>


    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <script>
        function drawMapMarkers(jsonData) {
            // 1. Initialize the map and set its view
            // Center the map over the approximate center of Dubai
            var dubaiCoords = [25.2048, 55.2708]; 
            var zoomLevel = 11;
            var map = L.map('map').setView(dubaiCoords, zoomLevel);

            // 2. Add the OpenStreetMap tile layer
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);

            jsonData.forEach(e => {
                ai_query = `I am looking for my provider to seek medical treatment. I am looking for this business on the google map:\n
                Name: ${e["PROVIDER NAME"]}\n
                Address: ${e.ADDRESS}\n
                Phone: ${e.TELEPHONE}\n
                Emirate: ${e.emirate}\n
                Type: ${e["PROVIDER TYPE"]}\n
                Area: ${e.AREA}\n
                `
                L.marker([e.lat, e.lon]).addTo(map)
                .bindPopup(`<h1 class="h5">${e["PROVIDER NAME"]}</h1><span>${e.ADDRESS}</span><p>Confidence:${e.confidence}</p>
                <a href="https://www.google.com/search?q=${encodeURIComponent(ai_query)}" target="_blank">Google AI</a>
                
                `);
            });
        }

                /**
         * Loads the content of the selected file using the Fetch API.
         */
        function loadInsuranceGeocode() {
            // 1. Get the selected filename from the dropdown
            const selectElement = document.getElementById('fileSelect');
            const filename = selectElement.value;
            const outputDiv = document.getElementById('output');

            // Clear previous content and check if a file was selected
            outputDiv.textContent = 'Loading...';
            if (!filename) {
                outputDiv.textContent = 'Select an insurance to load its content here.';
                return;
            }

            // 2. Use the Fetch API to request the file
            fetch(filename)
                .then(response => {
                    // Check if the response was successful (status 200-299)
                    if (!response.ok) {
                        // Throw an error if the file was not found or failed to load
                        throw new Error(`HTTP error! Status: ${response.status} - Could not find: ${filename}`);
                    }
                    // Determine how to read the file content based on the extension
                    // For simplicity, we assume text for all files here.
                    // For a JSON file, you would use response.json()
                    // return response.text(); // for plain text
                    
                    // Example to handle JSON differently
                    if (filename.endsWith('.json')) {
                        return response.json().then(data => {
                            return data; 
                        });
                    } else {
                        return response.text(); // for .txt or other text files
                    }
                })
                .then(content => {
                    drawMapMarkers(content); // Call function to draw map markers
                    const setup = document.getElementById('setup');
                    if (setup) {
                        setup.remove();
                    }

                })
                .catch(error => {
                    // 4. Handle any errors during the fetch or processing
                    console.error('Error loading the file:', error);
                    outputDiv.textContent = `Error: ${error.message}`;
                });
        }
    </script>
</body>
</html>
